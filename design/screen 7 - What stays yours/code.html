<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1.0">
  <title>MergeFlow — Screen 7 of 9: What stays yours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #14213D;
      color: #F4EDE0;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }
    .heading-style {
      font-weight: 300;
      letter-spacing: -0.035em;
      line-height: 0.98;
    }
  </style>
</head>
<body class="w-[1440px] min-h-[900px] bg-[#14213D] text-[#F4EDE0] flex items-center justify-center p-20 select-none">
  <div class="w-full max-w-[1280px] flex flex-col justify-between min-h-[720px]">
    
    <!-- Top & Ledger section -->
    <div class="w-full">
      <!-- Headline -->
      <h1 class="text-[60px] heading-style text-[#F4EDE0] mb-16">
        What stays yours.
      </h1>

      <!-- Ledger of 4 lines -->
      <div class="w-full space-y-0">
        <!-- Item 1 -->
        <div class="py-6">
          <div class="text-[34px] font-[300] tracking-[-0.02em] text-[#F4EDE0] mb-6">
            Every close.
          </div>
          <div class="w-full h-[1px] bg-[#FF6B5B]"></div>
        </div>

        <!-- Item 2 -->
        <div class="py-6">
          <div class="text-[34px] font-[300] tracking-[-0.02em] text-[#F4EDE0] mb-6">
            Every merge.
          </div>
          <div class="w-full h-[1px] bg-[#FF6B5B]"></div>
        </div>

        <!-- Item 3 -->
        <div class="py-6">
          <div class="text-[34px] font-[300] tracking-[-0.02em] text-[#F4EDE0] mb-6">
            The final call on every pull request.
          </div>
          <div class="w-full h-[1px] bg-[#FF6B5B]"></div>
        </div>

        <!-- Item 4 -->
        <div class="py-6">
          <div class="text-[34px] font-[300] tracking-[-0.02em] text-[#F4EDE0] mb-6">
            Your source code, which is never stored.
          </div>
          <div class="w-full h-[1px] bg-[#FF6B5B]"></div>
        </div>
      </div>
    </div>

    <!-- Bottom disclaimer strip -->
    <div class="pt-16">
      <p class="text-[16px] text-[#F4EDE0] opacity-70 font-normal">
        Not in the first version: bug finding, automatic closing, GitLab and Bitbucket, org-wide dashboards, self-hosting.
      </p>
    </div>

  </div>
</body>
</html>
